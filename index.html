<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --soft:#F1EDE6; --line:#E7E2DA;
  --ink:#26241F; --muted:#76716A; --faint:#A8A39B;
  --accent:#2F5D50; --accent-ink:#FFFFFF;
  --ok:#3F7D50; --ok-bg:#E6F1E8; --warn:#A8741F; --warn-bg:#F7EEDC; --danger:#B4523C; --danger-bg:#F6E4DF;
  --radius:14px; --shadow:0 1px 2px rgba(38,36,31,.05),0 4px 16px rgba(38,36,31,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#1F1E1B; --soft:#28261F; --line:#35322C;
    --ink:#EDEAE4; --muted:#A39E96; --faint:#6F6A62;
    --accent:#7FB8A4; --accent-ink:#10201B;
    --ok:#86C095; --ok-bg:#1F3326; --warn:#E2B866; --warn-bg:#3A2F1A; --danger:#E58A74; --danger-bg:#3D241E;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1F1E1B; --soft:#28261F; --line:#35322C;
  --ink:#EDEAE4; --muted:#A39E96; --faint:#6F6A62;
  --accent:#7FB8A4; --accent-ink:#10201B;
  --ok:#86C095; --ok-bg:#1F3326; --warn:#E2B866; --warn-bg:#3A2F1A; --danger:#E58A74; --danger-bg:#3D241E;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 64px}

/* Cabeçalho */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--danger)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:18px;height:18px}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px;margin-bottom:16px;box-shadow:var(--shadow)}
.monthbar .label{font-weight:600;font-size:16px;text-align:center;flex:1}
.monthbar .label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:20px;color:var(--muted)}
.nav-btn:hover{background:var(--soft);color:var(--ink)}

.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;border:1px solid}
.banner.local{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.banner.err{background:var(--danger-bg);border-color:transparent}

/* Cards de resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}

section{margin-bottom:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:600;margin:0}
.sec-head .hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}

/* Pessoas */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.person .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.person .name{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pct{font-size:12px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px}
.row2{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:3px 0}
.row2 b{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 8px}
.bar>span{display:block;height:100%;border-radius:999px}
.status{font-size:13px;font-weight:600}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.more{color:var(--accent)}
.extra{font-size:12px;color:var(--muted);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}

/* Acertos */
.settle{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px;margin-top:10px}
.settle .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.settle .it:last-child{border-bottom:0}
.settle .t{font-size:12px;color:var(--muted);padding:10px 0 2px}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.cat{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t1 span{font-weight:400;color:var(--muted)}
.item .t2{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:600;text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:3px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.danger{background:var(--danger-bg);color:var(--danger)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty .btn{margin-top:10px}

/* Histórico */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.hrow{display:grid;grid-template-columns:70px 1fr 96px;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.hrow.cur .m{font-weight:700}
.hrow .m{color:var(--muted)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
.hrow .tot{text-align:right;font-weight:600}
.hrow .tot small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* Modal */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,18,15,.45)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:8px 18px 4px}
.modal-f{display:flex;justify-content:space-between;gap:8px;padding:14px 18px 18px;flex-wrap:wrap}
.modal-f .right{display:flex;gap:8px;margin-left:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split{display:grid;gap:6px}
.split .sr{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;font-size:14px}
.split .sr input{text-align:right}
.sumline{font-size:12px;margin-top:4px;color:var(--muted)}
.sumline.bad{color:var(--danger);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 12px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.prow{display:grid;grid-template-columns:1fr 84px 44px;gap:8px;align-items:center;margin-bottom:8px}
.prow input{min-width:0;width:100%}
.prow input[type=color]{height:38px;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* Anexos */
.anexo{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--bg)}
.anexo .lbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px;display:block}
.anexo .cur{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.anexo .cur .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anexo .pick{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.anexo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.clip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:999px;margin-right:4px}
.clip svg{width:11px;height:11px}
.item .tags{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}

/* Login */
.login{max-width:380px;margin:40px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:var(--shadow)}
.login h2{margin:0 0 4px;font-size:18px}
.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login .btn{width:100%;padding:12px;font-size:15px;font-weight:600;margin-top:4px}
.login .erro{color:var(--danger);font-size:13px;margin:4px 0 10px;min-height:1em}
body.deslogado .monthbar, body.deslogado .mbar, body.deslogado #btnAjustes{display:none !important}
.conta-box{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.conta-box h4{margin:0 0 8px;font-size:14px}

/* Barra de ações fixa (celular) */
.mbar{display:none}

/* ===== Celular ===== */
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  header.top{margin-bottom:12px;flex-wrap:nowrap;align-items:center}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
  .sync{padding:6px 8px}
  .sync span{display:none}
  .icon-btn{width:40px;height:40px}
  .monthbar{position:sticky;top:0;z-index:5;margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top))}
  .nav-btn{width:44px;height:44px}
  .stats{gap:8px;margin-bottom:18px}
  .stat{padding:12px}
  .stat .v{font-size:18px}
  .people{grid-template-columns:1fr}
  .sec-head .btns{display:none}
  .sec-head .btns.keep{display:flex}
  .item{padding:12px;gap:10px;min-height:60px}
  .item .t1{white-space:normal}
  .item .t2{white-space:normal}
  .settle .it{flex-wrap:wrap}
  .hrow{grid-template-columns:46px 1fr 82px;gap:8px}
  .field input,.field select{font-size:16px;padding:11px 12px}
  .login{margin-top:16px} /* 16px evita zoom no iPhone */
  .split .sr input,.prow input{font-size:16px}
  .btn{padding:10px 14px;font-size:14px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh}
  dialog[open]{animation:sheet .22s ease-out}
  .modal-h{position:sticky;top:0;background:var(--surface);z-index:2;padding-top:14px}
  .modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .modal-f .right{flex:1}
  .modal-f .right .btn{flex:1}
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .mbar .btn{flex:1;padding:12px 8px;font-size:14px;font-weight:600}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){
  .grid2{grid-template-columns:1fr;gap:0}
  .stats{grid-template-columns:1fr}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>

/* ===================== Constantes ===================== */
const TABELAS = { pessoas:'cm_pessoas', contas:'cm_contas', lancamentos:'cm_lancamentos' };

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const LS_KEY = 'casa-da-mae-v1';
const BUCKET = 'cm-arquivos';
const MAX_MB = 10;          // limite por arquivo no Supabase
const MAX_MB_LOCAL = 2;     // no modo local o arquivo fica no navegador
const ACEITA = 'application/pdf,image/*';
const ICO_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>';

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const fmtBRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const round2 = n => Math.round((Number(n)||0)*100)/100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mesAtual(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function addMes(m,delta){ let [y,mo]=m.split('-').map(Number); mo+=delta; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return y+'-'+pad(mo); }
function nomeMes(m){ const [y,mo]=m.split('-').map(Number); return MESES[mo-1]+' '+y; }
function nomeMesCurto(m){ const [y,mo]=m.split('-').map(Number); return MESES_C[mo-1]+'/'+String(y).slice(2); }
function fmtData(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m; }
function diasNoMes(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); }
function parseValor(s){
  s = String(s ?? '').trim().replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isFinite(n) ? round2(n) : NaN;
}
function valorInput(n){ return (n===undefined||n===null||n==='') ? '' : Number(n).toFixed(2).replace('.',','); }
function cat(id){ return CATS.find(c=>c.id===id) || CATS[CATS.length-1]; }
function pessoa(id){ return S.pessoas.find(p=>p.id===id) || { id, nome:id||'—', cor:'#999', pct:0 }; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ===================== Armazenamento ===================== */
const Store = {
  mode:'local', sb:null, mem:null,
  init(){
    if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
      this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      this.mode = 'remote';
    }
  },
  _readLocal(){
    if(this.mem) return this.mem;
    let data = null;
    try { data = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}
    this.mem = data || { pessoas:[], contas:[], lancamentos:[] };
    return this.mem;
  },
  _writeLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(this.mem)); } catch(e){} },
  async loadAll(){
    if(this.mode==='remote'){
      const [p,c,l] = await Promise.all([
        this.sb.from(TABELAS.pessoas).select('*'),
        this.sb.from(TABELAS.contas).select('*'),
        this.sb.from(TABELAS.lancamentos).select('*')
      ]);
      const err = p.error || c.error || l.error;
      if(err) throw err;
      return { pessoas:p.data, contas:c.data, lancamentos:l.data };
    }
    const d = this._readLocal();
    return JSON.parse(JSON.stringify({ pessoas:d.pessoas, contas:d.contas, lancamentos:d.lancamentos }));
  },
  async upsert(tabela, rows){
    rows = Array.isArray(rows) ? rows : [rows];
    if(this.mode==='remote'){
      const { error } = await this.sb.from(TABELAS[tabela]).upsert(rows);
      if(error) throw error;
      return;
    }
    const d = this._readLocal();
    rows.forEach(r=>{
      const i = d[tabela].findIndex(x=>x.id===r.id);
      if(i>=0) d[tabela][i] = {...d[tabela][i], ...r}; else d[tabela].push(r);
    });
    this._writeLocal();
  },
  async remove(tabela, id){
    if(this.mode==='remote'){
      const { error } = await this.sb.from(TABELAS[tabela]).delete().eq('id', id);
      if(error) throw error;
      return;
    }
    const d = this._readLocal();
    d[tabela] = d[tabela].filter(x=>x.id!==id);
    this._writeLocal();
  },
  /* ---- Login (telefone + senha) ---- */
  async sessao(){
    if(this.mode!=='remote') return { local:true };
    const { data } = await this.sb.auth.getSession();
    return data.session;
  },
  async entrar(telefone, senha){
    const { error } = await this.sb.auth.signInWithPassword({ email: telefone + '@' + DOMINIO_LOGIN, password: senha });
    if(error) throw error;
  },
  async sair(){ if(this.mode==='remote'){ try{ await this.sb.auth.signOut({ scope:'local' }); }catch(e){ console.warn(e); } } },
  async trocarSenha(nova){
    const { error } = await this.sb.auth.updateUser({ password: nova });
    if(error) throw error;
  },
  async quemSou(){
    if(this.mode!=='remote') return null;
    const { data } = await this.sb.from('cm_membros').select('pessoa_id').limit(1);
    return data && data[0] ? data[0].pessoa_id : null;
  },

  /* ---- Arquivos (boleto / comprovante) ---- */
  async upload(file, nomeBase){
    const ext = (file.name.split('.').pop() || (file.type==='application/pdf'?'pdf':'jpg')).toLowerCase().replace(/[^a-z0-9]/g,'');
    const path = nomeBase + '-' + Date.now() + '.' + ext;
    if(this.mode==='remote'){
      const { error } = await this.sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined, upsert:false });
      if(error) throw error;
      return path;
    }
    if(file.size > MAX_MB_LOCAL*1024*1024) throw new Error('no modo local o limite é '+MAX_MB_LOCAL+' MB por arquivo');
    const dataUrl = await new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(file); });
    const d = this._readLocal(); d.arquivos = d.arquivos || {}; d.arquivos[path] = dataUrl;
    this._writeLocal();
    return path;
  },
  async urlArquivo(path){
    if(this.mode==='remote'){
      const { data, error } = await this.sb.storage.from(BUCKET).createSignedUrl(path, 60*60);
      if(error) throw error;
      return data.signedUrl;
    }
    const u = (this._readLocal().arquivos||{})[path];
    if(!u) throw new Error('arquivo não encontrado neste navegador');
    const blob = await (await fetch(u)).blob();
    return URL.createObjectURL(blob);
  },
  async removerArquivos(paths){
    paths = (paths||[]).filter(Boolean);
    if(!paths.length) return;
    try{
      if(this.mode==='remote'){ await this.sb.storage.from(BUCKET).remove(paths); return; }
      const d = this._readLocal(); paths.forEach(p=>{ if(d.arquivos) delete d.arquivos[p]; }); this._writeLocal();
    }catch(e){ console.warn('Falha ao remover arquivo', e); }
  },
  subscribe(onChange){
    if(this.mode!=='remote') return;
    let t;
    const deb = () => { clearTimeout(t); t = setTimeout(onChange, 350); };
    if(this.ch) return;
    const ch = this.sb.channel('casa-da-mae');
    Object.values(TABELAS).forEach(tb => ch.on('postgres_changes', { event:'*', schema:'public', table:tb }, deb));
    ch.subscribe();
    this.ch = ch;
  },
  unsubscribe(){
    if(this.ch){ this.sb.removeChannel(this.ch); this.ch = null; }
  }
};

/* ===================== Estado ===================== */
const S = { pessoas:[], contas:[], lancamentos:[], mes: mesAtual(), carregado:false, erro:null, logado:false, eu:null };

function normalizar(d){
  S.pessoas = (d.pessoas||[]).map(p=>({...p, pct:Number(p.pct)||0, ordem:Number(p.ordem)||0})).sort((a,b)=>a.ordem-b.ordem);
  S.contas = (d.contas||[]).map(c=>({...c, valor:Number(c.valor)||0, divisao: typeof c.divisao==='string' ? JSON.parse(c.divisao) : (c.divisao||{})}));
  S.lancamentos = (d.lancamentos||[]).map(l=>({...l, valor:Number(l.valor)||0}));
}

async function carregar(){
  try{
    const d = await Store.loadAll();
    if(!d.pessoas || d.pessoas.length===0){
      await Store.upsert('pessoas', PESSOAS_PADRAO);
      d.pessoas = PESSOAS_PADRAO.slice();
    }
    normalizar(d);
    S.erro = null; S.carregado = true;
  }catch(e){
    console.error(e);
    S.erro = e.message || String(e);
  }
  render();
}

async function salvar(tabela, rows, msg){
  try{
    await Store.upsert(tabela, rows);
    await carregar();
    if(msg) toast(msg);
    return true;
  }catch(e){ console.error(e); toast('Não foi possível salvar: '+(e.message||e)); return false; }
}
async function excluir(tabela, id, msg, arquivos){
  try{ await Store.remove(tabela, id); await Store.removerArquivos(arquivos); await carregar(); if(msg) toast(msg); return true; }
  catch(e){ console.error(e); toast('Não foi possível excluir: '+(e.message||e)); return false; }
}

/* ===================== Cálculos ===================== */
function divisaoPadrao(){ const o={}; S.pessoas.forEach(p=>o[p.id]=p.pct); return o; }

function resumoMes(m){
  const contas = S.contas.filter(c=>c.mes===m);
  const lanc = S.lancamentos.filter(l=>l.mes===m);
  const total = round2(contas.reduce((a,c)=>a+c.valor,0));
  const pagas = round2(contas.filter(c=>c.paga).reduce((a,c)=>a+c.valor,0));
  const ajudas = round2(lanc.filter(l=>l.tipo==='ajuda').reduce((a,l)=>a+l.valor,0));
  const porPessoa = S.pessoas.map(p=>{
    const cota = round2(contas.reduce((a,c)=>a + c.valor*(Number(c.divisao[p.id])||0)/100, 0));
    const pagouContas = round2(contas.filter(c=>c.paga && c.pago_por===p.id).reduce((a,c)=>a+c.valor,0));
    const enviou = round2(lanc.filter(l=>l.tipo==='repasse' && l.de===p.id).reduce((a,l)=>a+l.valor,0));
    const recebeu = round2(lanc.filter(l=>l.tipo==='repasse' && l.para===p.id).reduce((a,l)=>a+l.valor,0));
    const contribuiu = round2(pagouContas + enviou - recebeu);
    const saldo = round2(contribuiu - cota);
    const ajuda = round2(lanc.filter(l=>l.tipo==='ajuda' && l.de===p.id).reduce((a,l)=>a+l.valor,0));
    return { p, cota, pagouContas, enviou, recebeu, contribuiu, saldo, ajuda };
  });
  return { contas, lanc, total, pagas, abertas: round2(total-pagas), ajudas, porPessoa };
}

/* Quem deve repassar para quem, a partir do que já foi pago nas contas */
function acertos(r){
  const dev = r.porPessoa.filter(x=>x.saldo < -0.009).map(x=>({id:x.p.id, v:-x.saldo}));
  const cred = r.porPessoa.filter(x=>x.saldo > 0.009).map(x=>({id:x.p.id, v:x.saldo}));
  const out = [];
  dev.sort((a,b)=>b.v-a.v); cred.sort((a,b)=>b.v-a.v);
  let i=0,j=0;
  while(i<dev.length && j<cred.length){
    const v = round2(Math.min(dev[i].v, cred[j].v));
    if(v>0.009) out.push({de:dev[i].id, para:cred[j].id, valor:v});
    dev[i].v = round2(dev[i].v - v); cred[j].v = round2(cred[j].v - v);
    if(dev[i].v<=0.009) i++;
    if(cred[j].v<=0.009) j++;
  }
  return out;
}

/* ===================== Renderização ===================== */
function normalizarTelefone(t){
  let d = String(t||'').replace(/\D/g,'').replace(/^0+/,'');
  if(d.length===10 || d.length===11) d = '55' + d;
  return d;
}
function renderLogin(msg){
  document.body.classList.add('deslogado');
  const sync = $('#sync'); sync.className = 'sync'; sync.querySelector('span').textContent = 'Protegido';
  $('#banner').innerHTML = '';
  $('#subtitle').textContent = 'Acesso só para a família';
  $('#app').innerHTML = `<form class="login" id="frmLogin" autocomplete="on">
    <h2>Entrar</h2>
    <p>Use o seu número de celular e a sua senha.</p>
    <div class="field"><label for="lgTel">Celular com DDD</label><input id="lgTel" name="username" type="tel" inputmode="tel" autocomplete="username" placeholder="(19) 99999-9999" required></div>
    <div class="field"><label for="lgSenha">Senha</label><input id="lgSenha" name="password" type="password" autocomplete="current-password" required></div>
    <div class="erro" id="lgErro">${esc(msg||'')}</div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>`;
  $('#frmLogin').onsubmit = async e=>{
    e.preventDefault();
    const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
    $('#lgErro').textContent = '';
    try{
      await Store.entrar(normalizarTelefone($('#lgTel').value), $('#lgSenha').value);
      await iniciarSessao();
    }catch(err){
      console.error(err);
      $('#lgErro').textContent = /invalid/i.test(err.message||'') ? 'Celular ou senha incorretos.' : 'Não foi possível entrar: ' + (err.message||err);
      b.disabled = false; b.textContent = 'Entrar';
    }
  };
}

function render(){
  if(!S.logado) return renderLogin();
  document.body.classList.remove('deslogado');
  const sync = $('#sync');
  sync.className = 'sync ' + (S.erro ? 'err' : Store.mode==='remote' ? 'on' : 'local');
  sync.querySelector('span').textContent = S.erro ? 'Erro de conexão' : Store.mode==='remote' ? 'Na nuvem' : 'Modo local';

  const hoje = mesAtual();
  $('#mesLabel').innerHTML = esc(nomeMes(S.mes)) + (S.mes===hoje ? '<small>mês atual</small>' : '<small>&nbsp;</small>');
  $('#subtitle').textContent = S.pessoas.length ? 'Contas divididas entre ' + listaNomes(S.pessoas.map(p=>p.nome)) : 'Contas da casa divididas';

  let banner = '';
  if(S.erro) banner = `<div class="banner err"><b>Não consegui acessar o banco.</b> Confira se o SQL foi executado no Supabase e se a URL e a chave estão corretas. <span style="opacity:.75">(${esc(S.erro)})</span></div>`;
  else if(Store.mode==='local') banner = `<div class="banner local"><b>Modo local de teste.</b> Os registros ficam só neste navegador. Preencha a URL e a chave do Supabase no início do arquivo para salvar na nuvem e compartilhar.</div>`;
  $('#banner').innerHTML = banner;

  $('#mbar').style.visibility = S.carregado ? '' : 'hidden';
  if(!S.carregado){ $('#app').innerHTML = S.erro ? '' : '<div class="loading">Carregando…</div>'; return; }

  const r = resumoMes(S.mes);
  $('#app').innerHTML = [
    htmlStats(r),
    htmlPessoas(r),
    htmlContas(r),
    htmlLancamentos(r),
    htmlHistorico()
  ].join('');
}

function listaNomes(a){ return a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' e ' + a[a.length-1]; }

function htmlStats(r){
  const qtdAbertas = r.contas.filter(c=>!c.paga).length;
  return `<div class="stats">
    <div class="stat"><div class="k">Total de contas do mês</div><div class="v num">${fmtBRL(r.total)}</div><div class="s">${r.contas.length} ${r.contas.length===1?'conta':'contas'}</div></div>
    <div class="stat"><div class="k">Já pago</div><div class="v num">${fmtBRL(r.pagas)}</div><div class="s">${qtdAbertas ? `${fmtBRL(r.abertas)} em aberto` : (r.contas.length ? 'tudo quitado' : '—')}</div></div>
    <div class="stat"><div class="k">Ajudas no mês</div><div class="v num">${fmtBRL(r.ajudas)}</div><div class="s">fora da divisão</div></div>
  </div>`;
}

function htmlPessoas(r){
  const cards = r.porPessoa.map(x=>{
    const pctBar = x.cota>0 ? Math.min(100, Math.max(0, x.contribuiu/x.cota*100)) : 0;
    let st;
    if(x.cota===0 && x.contribuiu===0) st = `<span class="status" style="color:var(--muted)">Sem contas no mês</span>`;
    else if(Math.abs(x.saldo)<=0.009) st = `<span class="status ok">Em dia</span>`;
    else if(x.saldo<0) st = `<span class="status warn">Falta ${fmtBRL(-x.saldo)}</span>`;
    else st = `<span class="status more">Pagou ${fmtBRL(x.saldo)} a mais</span>`;
    const detalhe = [];
    if(x.pagouContas) detalhe.push(`pagou contas: ${fmtBRL(x.pagouContas)}`);
    if(x.enviou) detalhe.push(`repassou: ${fmtBRL(x.enviou)}`);
    if(x.recebeu) detalhe.push(`recebeu: ${fmtBRL(x.recebeu)}`);
    return `<div class="person">
      <div class="head"><div class="name"><span class="dot" style="background:${esc(x.p.cor)}"></span>${esc(x.p.nome)}</div><span class="pct num">${String(x.p.pct).replace('.',',')}%</span></div>
      <div class="row2"><span>Cota no mês</span><b class="num">${fmtBRL(x.cota)}</b></div>
      <div class="row2"><span>Já contribuiu</span><b class="num">${fmtBRL(x.contribuiu)}</b></div>
      <div class="bar"><span style="width:${pctBar}%;background:${esc(x.p.cor)}"></span></div>
      ${st}
      ${detalhe.length ? `<div class="row2" style="font-size:12px;margin-top:4px">${esc(detalhe.join(' · '))}</div>` : ''}
      ${x.ajuda ? `<div class="extra">Ajuda extra no mês: <b class="num" style="color:var(--ink)">${fmtBRL(x.ajuda)}</b></div>` : ''}
    </div>`;
  }).join('');

  const ac = acertos(r);
  const temPagamento = r.contas.some(c=>c.paga);
  let settle = '';
  if(temPagamento && ac.length){
    settle = `<div class="settle"><div class="t">Para equilibrar o mês, considerando as contas já pagas</div>${
      ac.map((a,i)=>`<div class="it"><span><b>${esc(pessoa(a.de).nome)}</b> repassa <b class="num">${fmtBRL(a.valor)}</b> para <b>${esc(pessoa(a.para).nome)}</b></span><button type="button" class="btn" data-acerto="${i}">Registrar</button></div>`).join('')
    }</div>`;
  }
  window._acertos = ac;
  return `<section>
    <div class="sec-head"><h2>Quem paga quanto <span class="hint">${esc(nomeMes(S.mes))}</span></h2></div>
    <div class="people">${cards}</div>
    ${settle}
  </section>`;
}

function htmlContas(r){
  const hoje = hojeISO();
  const linhas = r.contas.slice().sort((a,b)=>(a.vencimento||'9999').localeCompare(b.vencimento||'9999')).map(c=>{
    const k = cat(c.categoria);
    let chip;
    if(c.paga) chip = `<span class="chip ok">Paga${c.pago_por ? ' · '+esc(pessoa(c.pago_por).nome) : ''}</span>`;
    else if(c.vencimento && c.vencimento < hoje) chip = `<span class="chip danger">Vencida</span>`;
    else chip = `<span class="chip warn">Em aberto</span>`;
    const padrao = divisaoPadrao();
    const difere = S.pessoas.some(p=>Math.abs((Number(c.divisao[p.id])||0)-(Number(padrao[p.id])||0))>0.009);
    const sub = [ c.vencimento ? 'vence '+fmtData(c.vencimento) : 'sem vencimento' ];
    if(c.paga && c.pago_em) sub.push('paga em '+fmtData(c.pago_em));
    if(difere) sub.push('divisão: '+S.pessoas.map(p=>p.nome+' '+String(Number(c.divisao[p.id])||0).replace('.',',')+'%').join(' / '));
    return `<button type="button" class="item" data-conta="${esc(c.id)}">
      <span class="cat" style="background:${k.cor}">${k.sigla}</span>
      <span class="main"><div class="t1">${esc(k.nome)}${c.descricao ? ` <span>· ${esc(c.descricao)}</span>` : ''}</div><div class="t2">${esc(sub.join(' · '))}</div>${htmlClips(c)}</span>
      <span class="val num">${fmtBRL(c.valor)}<br>${chip}</span>
    </button>`;
  }).join('');

  const anteriores = S.contas.filter(c=>c.mes===addMes(S.mes,-1)).length;
  const vazio = `<div class="empty">Nenhuma conta lançada em ${esc(nomeMes(S.mes))}.${
    anteriores ? `<br><button type="button" class="btn" id="btnCopiar">Copiar as ${anteriores} contas de ${esc(nomeMes(addMes(S.mes,-1)))}</button>` : ''}</div>`;

  return `<section>
    <div class="sec-head"><h2>Contas do mês</h2><div class="btns"><button type="button" class="btn primary" id="btnNovaConta">+ Conta</button></div></div>
    <div class="list">${linhas || vazio}</div>
  </section>`;
}

function htmlClips(x){
  const t = [];
  if(x.boleto_path) t.push(`<span class="clip">${ICO_CLIP}boleto</span>`);
  if(x.comprovante_path) t.push(`<span class="clip">${ICO_CLIP}comprovante</span>`);
  return t.length ? `<div class="tags">${t.join('')}</div>` : '';
}

function htmlLancamentos(r){
  const linhas = r.lanc.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(l=>{
    const de = pessoa(l.de), para = l.para ? pessoa(l.para) : null;
    const ehAjuda = l.tipo==='ajuda';
    const titulo = ehAjuda ? `Ajuda de ${esc(de.nome)}${para ? ` <span>para ${esc(para.nome)}</span>` : ''}` : `${esc(de.nome)} <span>→</span> ${esc(para ? para.nome : '—')}`;
    const sub = [ehAjuda ? 'ajuda' : 'repasse', l.data ? fmtData(l.data) : null, l.obs || null].filter(Boolean).join(' · ');
    return `<button type="button" class="item" data-lanc="${esc(l.id)}">

function htmlHistorico(){
  const meses = []; for(let i=5;i>=0;i--) meses.push(addMes(S.mes,-i));
  const dados = meses.map(m=>{
    const cs = S.contas.filter(c=>c.mes===m);
    const porCat = {}; CATS.forEach(k=>porCat[k.id]=0);
    cs.forEach(c=>{ porCat[cat(c.categoria).id] += c.valor; });
    const total = cs.reduce((a,c)=>a+c.valor,0);
    const ajuda = S.lancamentos.filter(l=>l.mes===m && l.tipo==='ajuda').reduce((a,l)=>a+l.valor,0);
    return { m, porCat, total, ajuda };
  });
  const max = Math.max(1, ...dados.map(d=>d.total));
  const rows = dados.map(d=>`<div class="hrow ${d.m===S.mes?'cur':''}">
      <span class="m">${nomeMesCurto(d.m)}</span>
      <div class="stack" style="width:${Math.max(2,d.total/max*100)}%" title="${esc(CATS.filter(k=>d.porCat[k.id]).map(k=>k.nome+': '+fmtBRL(d.porCat[k.id])).join(' · '))}">${
        d.total ? CATS.filter(k=>d.porCat[k.id]>0).map(k=>`<span style="width:${d.porCat[k.id]/d.total*100}%;background:${k.cor}"></span>`).join('') : ''
      }</div>
      <span class="tot num">${d.total ? fmtBRL(d.total) : '—'}${d.ajuda ? `<small>+ ${fmtBRL(d.ajuda)} ajuda</small>` : ''}</span>
    </div>`).join('');
  return `<section>
    <div class="sec-head"><h2>Últimos 6 meses</h2><div class="btns keep"><button type="button" class="btn ghost" id="btnExportar">Exportar backup</button></div></div>
    <div class="hist">
      <div class="legend">${CATS.map(k=>`<span><i class="dot" style="background:${k.cor}"></i>${k.nome}</span>`).join('')}</div>
      ${rows}
    </div>
  </section>`;
}

function htmlAnexo(chave, rotulo, pathAtual, ajuda){

    </div>

/* Estado dos anexos no modal aberto: { chave: { atual, novo:File|null, remover:bool } } */
let ANX = {};
function ligarAnexos(atuais){
  ANX = {};
  Object.entries(atuais).forEach(([k,v])=>{ ANX[k] = { atual:v||null, novo:null, remover:false }; });
  form.querySelectorAll('[data-anexo]').forEach(box=>{
    const k = box.dataset.anexo, st = ANX[k];
    const fname = box.querySelector('[data-fname]');
    const inp = box.querySelector('[data-file]');
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0]; if(!f) return;
      const lim = (Store.mode==='remote' ? MAX_MB : MAX_MB_LOCAL);
      if(f.size > lim*1024*1024 && !/^image\//.test(f.type)){ toast('Arquivo maior que '+lim+' MB.'); inp.value=''; return; }
      st.novo = f; st.remover = false;
      fname.textContent = f.name + ' (' + (f.size/1024/1024).toFixed(1).replace('.',',') + ' MB) — será enviado ao salvar';
    };
    const ver = box.querySelector('[data-ver]');
    if(ver) ver.onclick = ()=>abrirArquivo(st.atual);
    const rm = box.querySelector('[data-rm]');
    if(rm) rm.onclick = ()=>{ st.remover = true; st.novo = null; inp.value=''; fname.innerHTML = '<span style="color:var(--danger)">Será removido ao salvar</span>'; };
  });
}
/* Reduz fotos grandes antes de enviar (PDF vai como está) */
async function prepararArquivo(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 1.2*1024*1024) return f;
  try{
    const img = await createImageBitmap(f);
    const max = 2000, k = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok=>c.toBlob(ok, 'image/jpeg', .82));
    if(!blob || blob.size >= f.size) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/,'') + '.jpg', { type:'image/jpeg' });
  }catch(e){ return f; }
}
/* Envia/remover anexos do modal. Retorna { campos, apagar } ou null em caso de erro. */
async function processarAnexos(prefixo){
  const campos = {}, apagar = [];
  for(const [k, st] of Object.entries(ANX)){
    if(st.novo){
      let f = await prepararArquivo(st.novo);
      const lim = (Store.mode==='remote' ? MAX_MB : MAX_MB_LOCAL);
      if(f.size > lim*1024*1024){ toast('Arquivo maior que '+lim+' MB.'); return null; }
      try{ campos[k] = await Store.upload(f, prefixo + '-' + k.replace('_path','')); }
      catch(e){ console.error(e); toast('Não foi possível enviar o arquivo: '+(e.message||e)); return null; }
      if(st.atual) apagar.push(st.atual);
    } else if(st.remover){
      campos[k] = null; if(st.atual) apagar.push(st.atual);
    }
  }
  return { campos, apagar };
}
async function abrirArquivo(path){
  if(!path) return;
  // Abre a aba já no clique (evita bloqueio de pop-up no celular) e depois aponta para o link
  const w = window.open('', '_blank');
  try{
    const url = await Store.urlArquivo(path);
    if(w){ w.location.href = url; } else { location.href = url; }
  }catch(e){ if(w) w.close(); toast('Não foi possível abrir: '+(e.message||e)); }
}

    </div>
    <div class="grid2">
      <div class="field"><label>Vencimento</label><input type="date" name="vencimento" value="${esc(c?.vencimento || vencPadrao)}"></div>

  abrirModal(c ? 'Editar conta' : 'Nova conta · '+nomeMes(S.mes), corpo, {

      const {div,soma} = lerDivisao(fd);

      const paga = fd.get('paga')==='on';

      if(!paga && ANX.comprovante_path){ ANX.comprovante_path.novo = null; if(ANX.comprovante_path.atual) ANX.comprovante_path.remover = true; }
      const anx = await processarAnexos(`contas/${mesConta}/${idConta}`);

        id: idConta, mes: mesConta,
        categoria: fd.get('categoria'), descricao: (fd.get('descricao')||'').trim() || null,
        valor, vencimento: fd.get('vencimento') || null,

  const chk = $('#chkPaga'); chk.onchange = ()=>{ $('#boxPaga').style.display = chk.checked ? '' : 'none'; };

function abrirAjustes(){
  const corpo = `
    <p class="note">Nome, percentual padrão e cor de cada pessoa. O percentual vale para as contas novas; cada conta guarda a própria divisão.</p>
    ${S.pessoas.map(p=>`<div class="prow">
      <input class="field-in" name="nome_${esc(p.id)}" value="${esc(p.nome)}" style="padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
      <div class="split" style="display:block"><input class="num" name="div_${esc(p.id)}" inputmode="decimal" value="${String(p.pct).replace('.',',')}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:right"></div>
      <input type="color" name="cor_${esc(p.id)}" value="${esc(p.cor||'#999999')}">
    </div>`).join('')}
    <div class="sumline" id="sumline"></div>
    <label class="check" style="margin-top:12px"><input type="checkbox" name="aplicar"> Aplicar a nova divisão às contas de ${esc(nomeMes(S.mes))}</label>
    ${Store.mode==='remote' ? `<div class="conta-box">
      <h4>Sua conta${S.eu ? ' · '+esc(pessoa(S.eu).nome) : ''}</h4>
      <div class="field"><label>Nova senha (mínimo 6 caracteres)</label><input type="password" id="novaSenha" autocomplete="new-password"></div>
      <div class="btns"><button type="button" class="btn" id="btnTrocarSenha">Trocar senha</button><button type="button" class="btn danger" id="btnSair">Sair</button></div>
    </div>` : ''}`;
  abrirModal('Ajustes da divisão', corpo, {
    salvar: async fd=>{
      const {div,soma} = lerDivisao(fd);
      if(Math.abs(soma-100)>0.05){ toast('Os percentuais precisam somar 100%.'); return false; }
      const rows = S.pessoas.map(p=>({ id:p.id, nome:(fd.get('nome_'+p.id)||p.nome).trim()||p.nome, pct:div[p.id], cor:fd.get('cor_'+p.id)||p.cor, ordem:p.ordem }));
      const ok = await salvar('pessoas', rows, 'Ajustes salvos');
      if(ok && fd.get('aplicar')==='on'){
        const contas = S.contas.filter(c=>c.mes===S.mes).map(c=>({...c, divisao:{...div}}));
        if(contas.length) await salvar('contas', contas, 'Divisão aplicada ao mês');
      }
      return ok;
    }
  });
  const upd=()=>{ const {soma}=lerDivisao(new FormData(form)); const el=$('#sumline');
    el.textContent='Soma: '+String(soma).replace('.',',')+'%'+(Math.abs(soma-100)>0.05?' — precisa fechar 100%':'');

    bt.disabled = true;

  };
  const bs = $('#btnSair');
  if(bs) bs.onclick = async ()=>{ dlg.close(); await Store.sair(); encerrarSessao(); };
}

async function copiarMesAnterior(){
  const ant = addMes(S.mes,-1);
  const dias = diasNoMes(S.mes);
  const novas = S.contas.filter(c=>c.mes===ant).map(c=>{
    let venc = null;
    if(c.vencimento){ const d = Math.min(Number(c.vencimento.slice(8,10)), dias); venc = S.mes+'-'+pad(d); }
    return { id:uid(), mes:S.mes, categoria:c.categoria, descricao:c.descricao||null, valor:c.valor, vencimento:venc,
      paga:false, pago_por:null, pago_em:null, divisao:{...c.divisao} };
  });
  if(novas.length) await salvar('contas', novas, 'Contas copiadas — confira os valores de gás e energia');
}

function exportar(){
  const blob = new Blob([JSON.stringify({ exportado_em:new Date().toISOString(), pessoas:S.pessoas, contas:S.contas, lancamentos:S.lancamentos }, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'casa-da-mae-backup-'+hojeISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

});
// Fechar o modal tocando fora dele
dlg.addEventListener('click', e=>{ if(e.target===dlg) dlg.close(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && Store.mode==='remote' && S.logado) carregar(); });

/* ===================== Início ===================== */
function encerrarSessao(){
  S.logado=false; S.eu=null; S.carregado=false; S.pessoas=[]; S.contas=[]; S.lancamentos=[];
  Store.unsubscribe(); renderLogin();
}
async function iniciarSessao(){
  S.logado = true;
  S.eu = await Store.quemSou();
  if(Store.mode==='remote' && !S.eu){
    await Store.sair();
    return renderLogin('Este número não tem acesso ao painel.');
  }
  await carregar();
  Store.subscribe(carregar);
}
Store.init();
(async ()=>{
  if(Store.mode==='remote'){
    Store.sb.auth.onAuthStateChange((ev)=>{
      if(ev==='SIGNED_OUT' && S.logado) encerrarSessao();
    });
  }
  const sess = await Store.sessao();
  if(sess) await iniciarSessao(); else renderLogin();
})();
</script>
